services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      # MongoDB refuses to start on Linux 6.19+ without this (SERVER-121912)
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: dev
    env_file: .env
    environment:
      PORT: ${PORT:-3000}
      DATABASE: mongodb://mongo:27017/lsec
      DATABASE_TEST: mongodb://mongo:27017/lsec_test
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$$PORT/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./src:/app/src
    depends_on:
      mongo:
        condition: service_healthy

  # Web UI for MongoDB: docker compose --profile tools up
  mongo-express:
    image: mongo-express:1
    profiles: [tools]
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
